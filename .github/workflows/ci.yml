name: ci

on:
  push:
    branches: ["**"]
  pull_request:

# Actions are pinned to commit SHAs, not tags. A tag is a label the publisher
# can move, so `@v4` is a promise to run whatever they point it at tomorrow --
# the same class of risk as an unpinned dependency, and the reason the lock
# files exist. The trailing comment keeps the version readable; Dependabot
# raises a PR when a pin falls behind, so pinning does not become staleness.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core is meant to be free of platform assumptions, so it is tested on
  # every platform from the start -- including macOS, which v1 does not support
  # yet. Path, encoding and line-ending bugs are cheap to find now and expensive
  # to find during the port (PRD 14.2).
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Six jobs a push was expensive enough to be a problem: macOS runners bill
      # at ten times a Linux minute and Windows at twice, and Dependabot now
      # opens several pull requests a week that each run the lot. Both Python
      # versions on Linux, where the difference between them actually shows up,
      # and one each on the platforms that cost.
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.11"
          - os: macos-latest
            python: "3.11"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Installed from the lock, with hashes: a pinned version says which
      # release was asked for, a hash says which bytes arrived.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .

      - name: Tests
        run: python -m pytest tests -q --cov=pharness.core --cov=pharness.console --cov-report=term-missing --cov-fail-under=80

  quality:
    name: lint and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/dev.lock
          python -m pip install --no-deps -e .

      - name: Ruff
        run: ruff check src tests spike && ruff format --check src tests spike

      # The platform boundary is enforced here rather than by discipline: a
      # stray `winreg` import in core/ fails the build instead of surfacing
      # months later when the macOS adapter is written (PRD 14.2).
      - name: Import boundaries
        run: lint-imports

  # A security tool that ignores its own dependencies is theatre. This job is
  # allowed to fail the build.
  supply-chain:
    name: dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/tooling.lock

      # Catches a pyproject edit that never made it into the locks. Without
      # this, the lock quietly stops describing what the project needs.
      - name: Locks match pyproject
        run: |
          ./requirements/lock.sh
          git diff --exit-code requirements/ \
            || (echo "::error::the lock files are out of date; run requirements/lock.sh" && exit 1)

      - name: Known vulnerabilities
        run: |
          pip-audit -r requirements/runtime.lock --progress-spinner off
          pip-audit -r requirements/dev.lock --progress-spinner off

      # Generated from the lock rather than from an installed environment, so
      # the same commit always produces the same inventory.
      - name: Bill of materials
        run: |
          mkdir -p sbom
          cyclonedx-py requirements requirements/runtime.lock -o sbom/pharness-runtime.cdx.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  spike:
    name: m0 spike self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r spike/requirements.txt

      - name: Self-test
        working-directory: spike
        run: python probe.py

  # A frozen binary is what "give it to someone else" actually means: a git
  # clone and a working Python are not an installation. Built on every push so
  # a packaging break is caught with the change that caused it, rather than on
  # release day.
  build:
    name: executable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: [supply-chain]
    # Two more runners on every dependency bump, to prove something a dependency
    # bump rarely changes. The tests still run on those pull requests.
    if: github.actor != 'dependabot[bot]'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements/runtime.lock
          python -m pip install --require-hashes -r requirements/packaging.lock
          python -m pip install --no-deps .

      - name: Build
        working-directory: packaging
        run: pyinstaller --clean --noconfirm --distpath ./dist --workpath ./build pharness.spec

      # The build succeeding proves nothing: a missing hidden import only shows
      # up when the binary runs. These commands touch the config loader, the
      # adapters, the audit log and the policy engine.
      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        working-directory: packaging/dist
        run: |
          ./ph --help
          ./ph doctor
          ./ph check npm test
          ./ph check -- docker compose down -v | grep -q DENY

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        working-directory: packaging/dist
        shell: pwsh
        run: |
          .\ph.exe --help
          .\ph.exe doctor
          .\ph.exe check npm test
          $verdict = .\ph.exe check -- docker compose down -v | Out-String
          if ($verdict -notmatch "DENY") { throw "the frozen build did not carry the policy" }

      # Not a signature -- that costs money and is still to come (PRD 17) -- but
      # it lets someone check that the file they downloaded is the file CI
      # produced, which is the part that costs nothing.
      - name: Checksums
        working-directory: packaging/dist
        shell: bash
        run: |
          if [ -f ph.exe ]; then sha256sum ph.exe > SHA256SUMS; else sha256sum ph > SHA256SUMS; fi
          cat SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ph-${{ matrix.os }}
          path: |
            packaging/dist/ph
            packaging/dist/ph.exe
            packaging/dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
