name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The core is meant to be free of platform assumptions, so it is tested on
  # every platform from the start -- including macOS, which v1 does not support
  # yet. Path, encoding and line-ending bugs are cheap to find now and expensive
  # to find during the port (PRD 14.2).
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest tests -q --cov=pharness.core --cov=pharness.console --cov-report=term-missing --cov-fail-under=80

  quality:
    name: lint and boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests spike && ruff format --check src tests spike

      # The platform boundary is enforced here rather than by discipline: a
      # stray `winreg` import in core/ fails the build instead of surfacing
      # months later when the macOS adapter is written (PRD 14.2).
      - name: Import boundaries
        run: lint-imports

  spike:
    name: m0 spike self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -r spike/requirements.txt

      - name: Self-test
        working-directory: spike
        run: python probe.py

  # A frozen binary is what "give it to someone else" actually means: a git
  # clone and a working Python are not an installation. Built on every push so
  # a packaging break is caught with the change that caused it, rather than on
  # release day.
  build:
    name: executable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build
        working-directory: packaging
        run: pyinstaller --clean --noconfirm --distpath ./dist --workpath ./build pharness.spec

      # The build succeeding proves nothing: a missing hidden import only shows
      # up when the binary runs. These commands touch the config loader, the
      # adapters, the audit log and the policy engine.
      - name: Smoke test (unix)
        if: runner.os != 'Windows'
        working-directory: packaging/dist
        run: |
          ./ph --help
          ./ph doctor
          ./ph check npm test
          ./ph check -- docker compose down -v | grep -q DENY

      - name: Smoke test (windows)
        if: runner.os == 'Windows'
        working-directory: packaging/dist
        shell: pwsh
        run: |
          .\ph.exe --help
          .\ph.exe doctor
          .\ph.exe check npm test
          $verdict = .\ph.exe check -- docker compose down -v | Out-String
          if ($verdict -notmatch "DENY") { throw "the frozen build did not carry the policy" }

      - uses: actions/upload-artifact@v4
        with:
          name: ph-${{ matrix.os }}
          path: |
            packaging/dist/ph
            packaging/dist/ph.exe
          if-no-files-found: error
          retention-days: 14
