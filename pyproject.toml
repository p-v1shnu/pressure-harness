[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pharness"
version = "0.1.0.dev0"
description = "Pressure Harness — local coding agent harness for ChatGPT"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "mcp>=2.0,<3",
    "tomli-w>=1.0",
    # For the DevTools protocol. Its blocking client keeps the browser tools
    # synchronous like everything else; the DevTools HTTP endpoints go through
    # the standard library rather than adding an HTTP dependency too.
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6",
    "ruff>=0.6",
    "import-linter>=2",
]

[project.scripts]
ph = "pharness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["pharness.core", "pharness.console"]
# The MCP handlers are covered by tests that run the server as a real
# subprocess, which coverage cannot see from here. Their registration is
# exercised in-process; the handler bodies are exercised over stdio.
omit = ["*/mcp/server.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# One long string holding a web page. Wrapping HTML and JavaScript to satisfy a
# Python line limit makes the markup harder to read, not easier.
"src/pharness/console/ui.py" = ["E501"]

# PRD 14.2: the platform boundary is enforced by CI, not by discipline.
[tool.importlinter]
root_packages = ["pharness"]
include_external_packages = true

# `core/` is domain logic and knows nothing about the machine. The composition
# root (`runtime.py`) and the transport surface (`mcp/`) sit outside it, because
# assembling the pieces means naming the platform -- which is exactly what core
# must not do. This contract is what forced that split, rather than a diagram
# nobody re-reads.
[[tool.importlinter.contracts]]
name = "core must not know about any OS"
type = "forbidden"
source_modules = ["pharness.core"]
forbidden_modules = [
    "pharness.adapters",
    "winreg",
    "msvcrt",
    "win32api",
    "win32com",
    "pywintypes",
    "AppKit",
    "Foundation",
]

[[tool.importlinter.contracts]]
name = "ports declare contracts and depend on nothing of ours"
type = "forbidden"
source_modules = ["pharness.ports"]
forbidden_modules = ["pharness.core", "pharness.adapters"]

[[tool.importlinter.contracts]]
name = "adapters must not import each other"
type = "independence"
modules = [
    "pharness.adapters.windows",
    "pharness.adapters.macos",
]
